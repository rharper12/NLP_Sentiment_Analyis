AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Sentiment Prep. FastAPI on Lambda (container image) behind an HTTP API, an S3 bucket for
  datasets, and a static-site bucket for the React UI. Secrets (X bearer token, optional database
  URL) are read from SSM SecureStrings at runtime; switching X accounts is one parameter
  override in samconfig.toml. IAM grants exactly the actions the code calls, on the narrowest
  resource each service supports.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9]+"
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  ApiKeySsmPath:
    Type: String
    Default: /sentiment-prep/dev/api-key
    Description: >
      SSM SecureString holding the shared secret every request must present. Required: the API
      spends X credits and AWS budget, so an open deployment is an open wallet.
  XBearerTokenSsmPath:
    Type: String
    Default: /sentiment-prep/dev/x-bearer-token
    Description: SSM SecureString holding the X API bearer token. Change to swap accounts.
  DatabaseUrlSsmPath:
    Type: String
    Default: ""
    Description: >
      SSM SecureString with a shared postgresql+psycopg:// URL. Required for paid X collection.
      Empty disables paid X collection; offline workflows use ephemeral SQLite history.
  XMaxReadsPerFetch:
    Type: Number
    Default: 1000
    MinValue: 1
  XMaxReadsPerDay:
    Type: Number
    Default: 3000
    MinValue: 1
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Additional comma-separated browser origins. The HTTPS site origin is included automatically.

Conditions:
  HasDatabaseUrl: !Not [!Equals [!Ref DatabaseUrlSsmPath, ""]]

Globals:
  Function:
    Timeout: 28
    MemorySize: 2048
    Architectures: [x86_64]

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sentiment-prep-data-${Stage}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireWorkingState   # in-flight bundles, not user saves
            Status: Enabled
            Prefix: _work/
            ExpirationInDays: 7
          - Id: ExpireDownloads
            Status: Enabled
            Prefix: _downloads/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: RemoveDownloadMarkers
            Status: Enabled
            Prefix: _downloads/
            ExpiredObjectDeleteMarker: true

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sentiment-prep-site-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOfBuiltAssets
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "sentiment-prep-site-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 86400

  # ---------------------------------------------------------------- compute
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/sentiment-prep-api-${Stage}"
      RetentionInDays: 14

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "sentiment-prep-api-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogGroup
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Sid: DatasetObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/*"
              - Sid: DatasetListing
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: BaselineSentiment
                Effect: Allow
                Action: comprehend:BatchDetectSentiment
                Resource: "*"   # Comprehend has no resource-level permissions
              - Sid: LiveComprehendPrice
                Effect: Allow
                Action: pricing:GetProducts
                Resource: "*"   # Price List API has no resource-level permissions
              - Sid: ReadSecrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeySsmPath}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${XBearerTokenSsmPath}"
                  - !If
                    - HasDatabaseUrl
                    - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseUrlSsmPath}"
                    - !Ref AWS::NoValue
              # SecureString decryption uses the AWS-managed aws/ssm key, whose key policy
              # already permits use through SSM. No kms:Decrypt grant is needed.

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sentiment-prep-api-${Stage}"
      PackageType: Image
      Role: !GetAtt ApiFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          RUNTIME: lambda
          LOG_LEVEL: !Ref LogLevel
          DATA_BUCKET: !Ref DataBucket
          API_KEY_SSM_PATH: !Ref ApiKeySsmPath
          X_BEARER_TOKEN_SSM_PATH: !Ref XBearerTokenSsmPath
          DATABASE_URL_SSM_PATH: !If [HasDatabaseUrl, !Ref DatabaseUrlSsmPath, !Ref AWS::NoValue]
          X_MAX_READS_PER_FETCH: !Ref XMaxReadsPerFetch
          X_MAX_READS_PER_DAY: !Ref XMaxReadsPerDay
          CORS_ORIGINS: !Sub "${CorsOrigins},https://${SiteDistribution.DomainName}"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
    Metadata:
      Dockerfile: backend/Dockerfile
      DockerContext: ../..
      DockerTag: !Ref Stage

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Split [",", !Sub "${CorsOrigins},https://${SiteDistribution.DomainName}"]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: ["*"]
        ExposeHeaders: [X-Request-Id, Content-Disposition]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  SwaggerUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/docs"
  DataBucketName:
    Value: !Ref DataBucket
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
