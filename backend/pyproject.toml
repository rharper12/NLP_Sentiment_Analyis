[project]
name = "sentiment-prep"
version = "0.1.0"
description = "Dataset preparation and preprocessing-impact analysis for sentiment analysis."
authors = [{ name = "Ron Harper" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.36",
    "httpx>=0.27",
    "nltk>=3.9",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "structlog>=24",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]",
    "pytest",
    "moto[s3]",
    "ruff",
    "mypy",
    "types-PyYAML",
    "boto3-stubs[comprehend,pricing,s3,ssm]",
    "playwright>=1.50",
    "setuptools==84.0.0",
    "uv==0.12.21",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentiment_prep = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Beyond style: BLE forces every broad `except` to carry a justification, DTZ bans timezone-naive
# datetimes (this code deals in money and daily caps), PTH keeps filesystem work on pathlib, and
# TRY/RET/SIM catch the control-flow habits that make code hard to follow later.
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "I",
    "N", "PIE", "PTH", "RET", "RUF", "SIM", "TRY", "UP",
]
ignore = [
    "D203", "D212", "D107", "D102", "D105", "D106",
    "TRY003",  # user-facing exception messages are written out in full, not in exception names
    "TRY400",  # logger.error with exc_info is deliberate; .exception() duplicates the message
]  # interface impls are documented on the base class

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501", "N803"]  # fakes mirror boto3 argument names

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: wall-clock assertions that may be excluded on a contended machine (-m 'not slow')",
]
