# Shared descriptions for the Clean screen and exported report. Keep behavior and limits
# consistent with the implementation and the options exposed in the UI.

missing_data:
  title: Handle empty records
  summary: Drop records with no text left, or fill them with a placeholder you choose.
  strengths: >
    Checks for empty text after earlier transformations. When selected, it runs last so it
    can catch records emptied by punctuation or stopword removal. Dropping those records
    avoids passing empty text to later analysis; filling preserves the row count.
  limitations: >
    Non-empty text may still be irrelevant or misleading. Dropping records can change class
    balance if empty results are more common in one class. Filling adds artificial text that
    downstream analysis must account for. Report how many records were dropped or filled.

lowercase:
  title: Lowercase
  summary: Fold case so the same word maps to one vocabulary entry.
  strengths: >
    Shrinks the vocabulary and merges sparse capitalised variants, which helps bag-of-words
    and TF-IDF models generalise from small datasets.
  limitations: >
    Destroys the emphasis signal in ALL CAPS ("this is AMAZING"), which correlates with strong
    sentiment. Transformer models with cased tokenizers do not need this step.

punctuation:
  title: Remove punctuation and special characters
  summary: Strip URLs, mentions, symbols, and stray characters; keep hashtag words.
  strengths: >
    Can reduce vocabulary differences caused by links, usernames, and punctuation when those
    features are not useful for the intended analysis. Hashtag words are retained.
  limitations: >
    Removes punctuation, emojis, and emoticons that can express sentiment. Links and mentions
    may also provide context or identify the target of an opinion. This step is optional;
    inspect the changed text before deciding whether the removals suit your dataset.

tokenize:
  title: Tokenize
  summary: Split text into word-level tokens with the Treebank tokenizer.
  strengths: >
    Creates a consistent token list for this pipeline. Treebank splits contractions
    ("don't" to "do" and "n't"), making negation available as a separate token.
  limitations: >
    Treebank can split URLs and hashtags into fragments. Space-joining its tokens changes
    formatting and token counts, so before/after differences can reflect representation
    changes. A downstream model may require its own tokenizer instead.

stopwords:
  title: Remove stopwords
  summary: Drop frequent function words; choose whether to keep negations.
  strengths: >
    Reduces token count and sparsity, so simple models spend capacity on content words rather
    than "the" and "of".
  limitations: >
    Removing negation can reverse the meaning of phrases such as "not good". Select Keep
    negations to retain the supported negation forms; that option starts unchecked in the UI.
    Other removed words may convey intensity or context, so inspect the results.

lemmatize:
  title: Lemmatize
  summary: Reduce words to dictionary form with WordNet.
  strengths: >
    Merges inflected forms ("loved", "loves") into one entry, which helps frequency-based
    models on small datasets.
  limitations: >
    WordNet depends on part-of-speech tags, so tagger mistakes propagate, and its verb rules
    occasionally over-strip ("hated" becomes "hat"). Lemmatization also erases tense and
    number, which occasionally matters for sentiment ("it was great" vs "it is great").
